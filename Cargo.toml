[workspace]
# The map overlay comes in as a git submodule (its own repo), built and shipped with the browser.
members = [".", "workshop", "overlay"]
default-members = [".", "workshop", "overlay"]

[package]
name = "dayz-browser"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "DayZ server browser and launcher, with the DayZ map overlay built in"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
eframe = "0.36"
egui_extras = "0.36"
env_logger = "0.11.11"
jiff = "0.2.38"
fs4 = { version = "1.1.0", default-features = false }
flate2 = "1.1.10"
log = "0.4.34"
maxminddb = "0.32"
notify-rust = "4.18.2"
open = "5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0"
toml = "1.1.6"
toml_edit = "0.25"
ureq = { version = "3.4", features = ["gzip", "brotli", "json"] }
# Unpacks Windows updates, and the Community Offline Mode release on every system.
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target."cfg(not(windows))".dependencies]
# Waits for a click on a notification for a while, not forever (both already come with
# notify-rust's D-Bus side).
async-io = "2.6"
flate2 = "1.1.10"
futures-lite = "2.6"
tar = "0.4.46"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
